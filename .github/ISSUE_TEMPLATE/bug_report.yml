name: Signaler un bug
description: Signaler un comportement anormal
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
  - type: input
    id: env
    attributes:
      label: Environnement (OS, version du langage...)
