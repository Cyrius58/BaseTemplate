# Configuration pre-commit (https://pre-commit.com)
# Installation : pip install pre-commit && pre-commit install
# Décommentez les blocs correspondant aux langages utilisés dans le projet.

repos:
  # ---- Hooks génériques (toujours actifs) ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  # ---- Détection de secrets (toujours actif) ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ---- Validation du message de commit (Conventional Commits) ----
